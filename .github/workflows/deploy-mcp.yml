# Deploys the MCP server(s) to Cloudflare Workers when mcp/ files change.
# Triggers on pushes to main that modify the mcp directory.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token with Workers edit permission
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare account ID

name: Deploy MCP servers

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: mcp/stable
        run: npm ci

      - name: Deploy stable MCP worker
        working-directory: mcp/stable
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pre-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: mcp/pre-release
        run: npm ci

      - name: Deploy pre-release MCP worker
        working-directory: mcp/pre-release
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
